# Builds Angband for the Asciiverse catalog and as system packages.
# (release.yaml beside this file is upstream's own and runs only on
# pushes to master.)
#
# For av: one archive per target, named angband-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Each archive holds the angband program, the
# read-only lib folder it reads beside itself (gamedata, customize, help,
# screens) and the licence.
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux build, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v4.2.6-av.1: upstream's version, then our packaging
# release. Linux builds are fully static (Alpine, musl, ncursesw); macOS
# builds both architectures on one runner against the system ncurses.
# Curses frontend only, no tiles. No Windows build yet (see PATCHES.md).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: angband
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file angband
          sh asciiverse/stage.sh

      - name: Smoke test
        run: |
          # the program must find lib/ beside itself and start a game
          (cd /tmp && script -qec "TERM=xterm LANG=C.UTF-8 HOME=/tmp/h timeout 5 $PWD/stage/angband" /dev/null </dev/null || true) >smoke.log
          grep -aq "Initialization" smoke.log || { tail -c 2000 smoke.log; exit 1; }
          ls /tmp/h/.local/share/angband

      - name: Package for av
        run: |
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          brew install autoconf automake >/dev/null
          CC_ARCH=${{ matrix.arch }} sh asciiverse/build.sh
          file angband
          otool -L angband
          sh asciiverse/stage.sh

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Angband $TAG" \
                 --notes "Angband ${TAG%%-av.*} by the Angband Dev Team, the curses (terminal) build for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. The non-free Shockbolt tiles are removed and no tiles are shipped. See PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
